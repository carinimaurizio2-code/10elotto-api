name: Aggiorna Estrazioni 10eLotto

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Scarica e parsa estrazioni
        run: python scraper.py

      - name: Commit e push dati aggiornati
        run: |
          git config --global user.email "bot@10elotto.it"
          git config --global user.name "10eLotto Bot"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornamento estrazioni $(date +%Y-%m-%d-%H-%M)"
          git push
