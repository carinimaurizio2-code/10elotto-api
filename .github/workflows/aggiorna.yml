name: Aggiorna Estrazioni 10eLotto Serale

on:
  schedule:
    # Giorni estrazione: mar(2), gio(4), ven(5), sab(6).
    # 18:00-21:50 UTC copre le 19:00-22:50 italiane (sia ora legale sia solare).
    - cron: '*/10 18-21 * * 2,4,5,6'
    # Recupero la mattina dopo (mer, ven, sab, dom) se la sera e' andata male.
    - cron: '30 7 * * 0,3,5,6'
  workflow_dispatch:

# Un solo gruppo di concorrenza: evita che due run facciano push insieme
concurrency:
  group: aggiorna-archivio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # serve per il rebase prima del push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Scarica e parsa estrazioni
        run: python scraper_serale.py

      - name: Commit e push dati aggiornati
        if: always()
        run: |
          git config user.email "bot@10elotto.it"
          git config user.name "10eLotto Bot"
          git add data/archivio_serale.csv
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "Aggiornamento estrazioni $(date +%Y-%m-%d-%H-%M)"
          # Riprova fino a 3 volte: pull --rebase + push (risolve il 'fetch first')
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Tentativo $i fallito, riprovo tra 5 secondi..."
            sleep 5
          done
          echo "Push non riuscito dopo 3 tentativi"
          exit 1
