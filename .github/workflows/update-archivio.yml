name: Aggiorna archivio 10eLotto Serale

on:
  schedule:
    - cron: "25 18 * * *"
    - cron: "25 19 * * *"
    - cron: "10 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggiorna CSV
        run: python scripts/update_archivio.py
      - name: Commit se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archivio_serale.csv data/LAST_RUN.txt
          if git diff --staged --quiet; then
            echo "Nessuna nuova estrazione"
          else
            git commit -m "chore: aggiorna archivio serale"
            git push
          fi
