name: Aggiorna Archivio 10eLotto Serale

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scarica archivio serale
        run: python scripts/update_archivio.py

      - name: Commit risultati
        if: always()
        run: |
          git config user.name "10elotto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/archivio_serale.csv data/LAST_RUN.txt || true
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare"
          else
            git commit -m "auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
