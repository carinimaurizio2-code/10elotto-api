name: Aggiorna Archivio 10eLotto

on:
  schedule:
    # Esegue ogni giorno alle 20:45 UTC (22:45 ora italiana, dopo le estrazioni)
    - cron: '45 20 * * *'
  workflow_dispatch: # Permette di lanciarlo manualmente dal sito di GitHub

jobs:
  aggiorna-archivio:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Permette allo script di fare commit nel repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui Script di Scraping
        run: python scripts/update_archivio.py

      - name: Commit e Push automatico del CSV aggiornato
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Aggiornamento automatico archivio serale"
          file_pattern: "data/archivio_serale.csv"
          commit_user_name: "10eLotto Bot"
          commit_user_email: "bot@10elotto.local"
